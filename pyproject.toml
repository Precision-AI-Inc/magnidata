# ── Project identity ──────────────────────────────────────────────────────────

[build-system]
requires = ["setuptools>=61", "wheel", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "magnidata"
dynamic = ["version"]
description = "Precision AI — interactive visual-query dashboard for image datasets: deterministic feature extraction, embeddings/PCA/cluster 3D exploration, and a Flask API + React dashboard."
readme = "README.md"
license = { file = "LICENSE.md" }
authors = [{ name = "Precision AI", email = "reinier@precision.ai" }]
maintainers = [{ name = "Precision AI", email = "reinier@precision.ai" }]
requires-python = ">=3.10"
keywords = [
    "computer-vision",
    "data-visualization",
    "machine-learning",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
# Runtime deps for the Flask API + feature-extraction toolkit. Embeddings/NIMA
# computation (torch/timm/pyiqa) is a separate, optional install — see [ml] below.
dependencies = [
    "flask>=3.0",
    "flask-cors>=4.0",
    "pillow>=10.0",
    "numpy>=1.26",
    "scikit-learn>=1.4",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
# Offline embeddings generation (tools/embeddings.py) and learned image-quality
# scoring (tools/nima.py) — deliberately not a runtime dependency of the API
# itself (see Dockerfile.api); install this extra to run those CLI tools.
ml = [
    "torch==2.12.1",
    "torchvision==0.27.1",
    "timm==1.0.27",
    "pyiqa==0.1.13",
    "tqdm>=4.66",
]
test = [
    "pytest>=7.0",
    "pytest-cov>=5.0",
]
dev = [
    "pytest>=7.0",
    "pytest-cov>=5.0",
    "pre-commit>=3.7",
    # Pinned to the rev in .pre-commit-config.yaml — a different ruff version
    # reports a different rule set, so an unpinned local run would disagree with CI.
    "ruff==0.15.17",
    "pyright>=1.1",
    "genbadge[coverage]>=1.1",
]

# No [project.scripts] entry for the API: precisionai/magnidata/api/*.py use flat,
# sibling-style imports (import db, import local_files) by design, since Dockerfile.api
# copies them flat into the image root and runs `python app.py` directly — see that
# file's own docstring. That means app.py can't be invoked as an installed console
# script (its imports would fail once run from outside its own directory); run it via
# `docker compose up` or `python app.py` from precisionai/magnidata/api/ instead — see
# README.md.

[project.urls]
Homepage = "https://github.com/Precision-AI-Inc/magnidata"
Repository = "https://github.com/Precision-AI-Inc/magnidata"
Issues = "https://github.com/Precision-AI-Inc/magnidata/issues"
Changelog = "https://github.com/Precision-AI-Inc/magnidata/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
where = ["."]
include = ["precisionai*"]

[tool.setuptools.package-data]
# Non-.py runtime assets, needed for a real (non-editable) install: the COCO128 demo
# build reads its precomputed embeddings from this file, resolved relative to
# scripts/prepare_coco128_dashboard.py's own installed location (see dataset_builder.py's
# COCO128_EMBEDDINGS_ASSET). confi.yaml is the dataset registry the API reads.
"precisionai.magnidata.scripts" = ["coco128_embeddings.json"]
"precisionai.magnidata" = ["confi.yaml"]

[tool.setuptools_scm]
version_scheme = "no-guess-dev"
local_scheme = "no-local-version"
fallback_version = "0.0.0"

# ── pytest ────────────────────────────────────────────────────────────────────
# Tests are colocated with source (precisionai/magnidata/**/test_*.py), not under a
# top-level tests/ — a deliberate deviation from the template's layout; see
# CONTRIBUTING.md.
[tool.pytest.ini_options]
testpaths = ["precisionai/magnidata"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "--cov=precisionai --cov-report=term-missing --cov-fail-under=60"
markers = [
    "integration: marks tests that require external resources (deselect with '-m \"not integration\"')",
]

[tool.coverage.run]
source = ["precisionai"]
omit = ["*/test_*.py", "*/__init__.py"]
relative_files = true

[tool.coverage.report]
# 60, not the org-standard 90 — measured production-code coverage at migration time
# (test files excluded via omit= above) was 63.2%. Raising this toward 90 is tracked,
# ongoing work; see CONTRIBUTING.md.
fail_under = 60
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise ImportError",
    "except ImportError",
]

# ── pyright ───────────────────────────────────────────────────────────────────
[tool.pyright]
pythonVersion = "3.10"
typeCheckingMode = "standard"
reportMissingImports = false
reportMissingModuleSource = false

# ── ruff ──────────────────────────────────────────────────────────────────────
[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
    "N",    # pep8-naming
    "C90",  # mccabe complexity
    "D",    # pydocstyle
    "PT",   # flake8-pytest-style
    "RUF",  # ruff-specific rules
    "PL",   # pylint
    "ANN",  # flake8-annotations — enforce PEP 484 type hints
    "PERF", # perflint — performance anti-patterns
    "S",    # flake8-bandit — security linting
]
ignore = [
    "E501",    # line too long — enforced by ruff-format at 120 chars
    "B008",    # function calls in default args (FastAPI-style default-arg pattern)
    "SIM108",  # ternary operator — sometimes less readable
    "D100",    # missing docstring in public module
    "D104",    # missing docstring in public package
    "D203",    # one-blank-line-before-class (conflicts with D211)
    "D213",    # multi-line-summary-second-line (conflicts with D212)
    "PLR0913", # too many arguments — common in evaluation functions
    "PLR2004", # magic value comparisons — acceptable in tests/metrics
    "ANN401",  # typing.Any is allowed for genuinely dynamic types
    "S311",    # pseudo-random generators are intentional in scientific code
    "S104",    # binding to 0.0.0.0 is intentional for a configurable server host
    "S310",    # urlopen() audit — every call site validates the URL scheme first
               # (see dataset_builder.py/local_files.py/prepare_coco128_dashboard.py);
               # ruff does no control-flow analysis so it can't see the guard, but
               # there is no code-level fix that clears this short of a literal URL.
]

[tool.ruff.lint.per-file-ignores]
"**/__init__.py" = ["F401"]
# Tests are colocated with source (no top-level tests/ dir — see CONTRIBUTING.md),
# so this matches by filename rather than directory.
"**/test_*.py" = ["D", "PLR", "ANN", "S"]
"docs/conf.py" = ["E402", "UP031", "ANN", "S"]
# load_dotenv() must run, and DATA_ROOT/etc. must be read from the environment,
# before importing db.py/local_files.py/dataset_builder.py (they read their own
# env-derived config at import time) — the E402 this produces is unavoidable
# without breaking local .env overrides.
"precisionai/magnidata/api/app.py" = ["E402"]
# prepare_coco128_dashboard.py: PLC0415 on the run_pipeline() import of tools.features/
# embeddings is deliberate — it happens after a sys.path.insert() that makes the
# package importable from an uninstalled checkout (this script's whole point per its
# own docstring), so it structurally cannot move to module level. S603 is the
# shutil.which("docker")-resolved subprocess call in start_dashboard(): ruff's S603
# only treats a fully literal argument list as "trusted", so resolving the binary
# portably (rather than hardcoding a path) always trips it, same underlying limitation
# as the S310 case above.
"precisionai/magnidata/scripts/prepare_coco128_dashboard.py" = ["PLC0415", "S603"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.isort]
known-first-party = ["precisionai"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true
