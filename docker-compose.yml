# Self-contained MagniData dev stack — API (Flask) + portal (React/nginx) + MLflow + trainer worker.
# Run from the repo root:   docker compose up --build
#   portal -> http://localhost:5175   api -> http://localhost:5051
#   MLflow UI -> http://localhost:5052
#
# This compose file and both Dockerfiles (Dockerfile.api, Dockerfile.dashboard)
# live at the repo root; the application source they build stays under
# precisionai/magnidata/ — see precisionai/magnidata/README.md. Data/config are
# mounted straight from the repo root so the large CSVs and embeddings
# (Git LFS, if you add any under ./data) are not duplicated into the release folder.
# Pin the Compose project name so containers/volumes are magnidata-* regardless of
# what the checkout directory happens to be called.
name: magnidata

services:

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    ports:
      - "5051:5050"
    volumes:
      - ./data:/app/data:ro                                   # CSVs + embeddings (read-only)
      - ./image_sets:/app/image_sets:ro                       # local staged images for recipe datasets
      - ./precisionai/magnidata/data_user:/app/data_user        # user-created child datasets (read-write)
      - ./precisionai/magnidata/confi.yaml:/app/confi.yaml:ro   # dataset registry
      - magnidata-api-db:/app/db                                 # notes/partitions SQLite (persists)
      # Optional: mount a shared datalake for confi.yaml entries whose images live outside
      # this repo (see local_files.py's DATALAKE_ROOT/THUMB_ROOT_* env vars). Not required —
      # the API starts fine without it; local_files.local_status() reports it as unavailable.
      # - /path/to/your/datalake:/mnt/disks/ssd-raid/datalake-clone:ro
      # - /path/to/your/thumbnails:/mnt/disks/ssd-raid/datalake-clone-thumbnails:ro
    depends_on:
      mlflow:
        condition: service_healthy
    environment:
      MLFLOW_TRACKING_URI: http://mlflow:5000
      # Browser-facing MLflow URL, used for deep links from the dashboard.
      MAGNIDATA_MLFLOW_UI_URL: http://localhost:5052
      CONFIG_PATH: /app/confi.yaml
      DATA_ROOT: /app
      DB_PATH: /app/db/notes.db
      API_PORT: "5050"
      # Host-facing URLs the API prints in its startup banner — keep in sync with the
      # published ports (api 5051, web 5175) if you remap them.
      MAGNIDATA_PORTAL_URL: "http://localhost:5175"
      MAGNIDATA_API_URL: "http://localhost:5051"
      # BYOD upload cap for images + annotations. nginx.conf is set slightly above this
      # so Flask returns JSON validation errors for over-limit requests.
      DATASET_BUILD_MAX_TOTAL_BYTES: "17179869184"
    # Optional local overrides (DATALAKE_ROOT, THUMB_ROOT_*, ALLOWED_REMOTE_IMAGE_HOSTS, …) —
    # copy precisionai/magnidata/api/.env.example to a .env alongside it and uncomment below.
    # env_file:
    #   - ./precisionai/magnidata/api/.env

  # Local experiment tracking: the system of record for training runs. No auth — it is
  # meant for the developer's machine only. Host-side tools (e.g. a pai-seed run on the
  # host) log to it with MLFLOW_TRACKING_URI=http://localhost:5052.
  mlflow:
    image: ghcr.io/mlflow/mlflow:v3.11.1
    command: >
      mlflow server --host 0.0.0.0 --port 5000
      --backend-store-uri sqlite:////mlflow/mlflow.db
      --artifacts-destination /mlflow/artifacts --serve-artifacts
      --allowed-hosts "*"
    ports:
      - "5052:5000"
    volumes:
      - magnidata-mlflow:/mlflow
    restart: unless-stopped
    healthcheck:
      # The image ships no curl.
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Runs the training jobs the dashboard schedules in MLflow. One worker only: MLflow has no
  # compare-and-set, so two workers could claim the same run. CPU by default; on a GPU host
  # add docker-compose.gpu.yml (CUDA torch + nvidia device), e.g. by setting
  # COMPOSE_FILE=docker-compose.yml:docker-compose.gpu.yml in the git-ignored .env.
  trainer:
    build:
      context: .
      dockerfile: Dockerfile.trainer
    hostname: trainer   # stable, so a restarted worker can recognise runs its predecessor left behind
    restart: unless-stopped
    depends_on:
      mlflow:
        condition: service_healthy
    environment:
      MLFLOW_TRACKING_URI: http://mlflow:5000
      DATA_ROOT: /app
    volumes:
      - ./data:/app/data:ro
      - ./image_sets:/app/image_sets:ro
      - ./precisionai/magnidata/data_user:/app/data_user

  web:
    build:
      context: ./precisionai/magnidata/dashboard
      dockerfile: ../../../Dockerfile.dashboard
    ports:
      - "5175:80"
    depends_on:
      - api

volumes:
  magnidata-api-db:
  magnidata-mlflow:
