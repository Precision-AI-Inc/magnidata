server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Use Docker's embedded DNS so the upstream IP is re-resolved on each
    # connection — prevents stale IPs after the API container is rebuilt.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Proxy all /api calls to the Flask backend
    location /api {
        set $upstream http://api:5050;
        proxy_pass $upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Allow large CSV downloads
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # SPA fallback — all other paths serve index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
