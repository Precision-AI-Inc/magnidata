name: Release MCP server

# Publishes the magnidata-mcp package to PyPI and mcp-server/server.json to the official MCP Registry, as
# io.github.Precision-AI-Inc/magnidata. It runs only when started by hand on a release tag:
#
#   gh workflow run release-mcp.yml --ref vX.Y.Z
#
# One-time setup (a PyPI trusted publisher and the `pypi` environment) is described in mcp-server/README.md,
# section "Publishing".

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    uses: ./.github/workflows/unit-test.yml

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Require a release tag
        run: |
          if [[ "$GITHUB_REF_TYPE" != "tag" || ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+ ]]; then
            echo "Run this workflow on a vX.Y.Z tag (gh workflow run release-mcp.yml --ref vX.Y.Z), not on $GITHUB_REF_NAME." >&2
            exit 1
          fi

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.10"

      - name: Install build tooling
        run: pip install build

      # Builds the sdist, then the wheel from that sdist, so a broken sdist fails here rather than for users.
      - name: Build sdist and wheel
        run: python -m build mcp-server --outdir dist

      - name: Check the wheel installs, runs and matches the tag
        run: |
          python -m venv /tmp/smoke
          /tmp/smoke/bin/pip install dist/*.whl
          /tmp/smoke/bin/magnidata-mcp --help > /dev/null
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          BUILT_VERSION=$(/tmp/smoke/bin/python -c "import importlib.metadata as m; print(m.version('magnidata-mcp'))")
          if [ "$TAG_VERSION" != "$BUILT_VERSION" ]; then
            echo "Tag v$TAG_VERSION does not match built version $BUILT_VERSION" >&2
            exit 1
          fi

      - name: Stamp the release version into server.json
        run: |
          mkdir registry
          jq --arg v "${GITHUB_REF_NAME#v}" '.version = $v | .packages[0].version = $v' mcp-server/server.json \
            > registry/server.json
          cat registry/server.json

      - uses: actions/upload-artifact@v7
        with:
          name: mcp-dist
          path: dist/

      - uses: actions/upload-artifact@v7
        with:
          name: mcp-server-json
          path: registry/server.json

  publish-pypi:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: mcp-dist
          path: dist/

      - name: Publish to PyPI (trusted publishing)
        uses: pypa/gh-action-pypi-publish@release/v1

  publish-registry:
    needs: publish-pypi
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    env:
      MCP_PUBLISHER_VERSION: v1.8.9
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: mcp-server-json

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Download and verify mcp-publisher
        run: |
          set -euo pipefail
          archive="mcp-publisher_linux_amd64.tar.gz"
          base_url="https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}"
          curl --fail --location --silent --show-error --output "$archive" "$base_url/$archive"
          curl --fail --location --silent --show-error --output "$archive.sigstore.json" "$base_url/$archive.sigstore.json"
          cosign verify-blob \
            --bundle "$archive.sigstore.json" \
            --certificate-identity "https://github.com/modelcontextprotocol/registry/.github/workflows/release.yml@refs/tags/${MCP_PUBLISHER_VERSION}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "$archive"
          tar xzf "$archive" mcp-publisher
          rm -f "$archive" "$archive.sigstore.json"

      - name: Authenticate to the MCP Registry (GitHub OIDC)
        run: ./mcp-publisher login github-oidc

      # The registry confirms ownership by reading the package's README from PyPI, which can lag a fresh upload.
      - name: Publish server.json
        run: |
          for attempt in 1 2 3 4 5; do
            if ./mcp-publisher publish server.json; then
              exit 0
            fi
            if [ "$attempt" -lt 5 ]; then
              echo "Publish failed; retrying in 30 seconds (attempt $((attempt + 1))/5)..."
              sleep 30
            fi
          done
          echo "Unable to publish server.json after 5 attempts." >&2
          exit 1
