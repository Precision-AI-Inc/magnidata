version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"

  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      python-dependencies:
        patterns: ["*"]

  - package-ecosystem: "pip"
    directory: "/mcp-server"
    schedule:
      interval: "weekly"
    groups:
      mcp-server-dependencies:
        patterns: ["*"]
