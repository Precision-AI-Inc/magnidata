name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

jobs:
  test:
    uses: ./.github/workflows/unit-test.yml

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.10"
          cache: pip

      - name: Install build tooling
        run: pip install build twine

      - name: Build sdist and wheel
        run: python -m build

      - name: Check the metadata PyPI will render
        run: twine check --strict dist/*

      - name: Install built wheel (so importlib.metadata can read its version)
        run: pip install dist/*.whl

      - name: Check the console scripts run from the installed wheel
        run: |
          magnidata-features --help
          magnidata-embeddings --help
          magnidata-attach --help

      - name: Check version matches tag
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          BUILT_VERSION=$(python -c "import importlib.metadata as m; print(m.version('magnidata'))")
          if [ "$TAG_VERSION" != "$BUILT_VERSION" ]; then
            echo "Tag v$TAG_VERSION does not match built version $BUILT_VERSION" >&2
            exit 1
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  github-release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - name: Detect pre-release
        id: prerelease
        run: |
          if [[ "${GITHUB_REF_NAME}" =~ [.]?(dev|a|b|rc)[0-9]+$ ]]; then
            echo "value=true" >> "$GITHUB_OUTPUT"
          else
            echo "value=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF_NAME}"
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" \
              --verify-tag \
              --draft \
              --generate-notes
          fi

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF_NAME}"
          for attempt in 1 2 3 4 5; do
            if gh release upload "$tag" dist/* --clobber; then
              exit 0
            fi
            if [ "$attempt" -lt 5 ]; then
              echo "Asset upload failed; retrying in 10 seconds (attempt $((attempt + 1))/5)..."
              sleep 10
            fi
          done
          echo "Unable to upload release assets after 5 attempts." >&2
          exit 1

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          PRERELEASE: ${{ steps.prerelease.outputs.value }}
        run: |
          tag="${GITHUB_REF_NAME}"
          if [ "$PRERELEASE" = "true" ]; then
            gh release edit "$tag" --draft=false --prerelease
          else
            gh release edit "$tag" --draft=false
          fi

  # Off until a maintainer sets the repository variable PYPI_PUBLISH to "true", after
  # registering this workflow as the project's trusted publisher on PyPI (see
  # CONTRIBUTING.md, "Publishing to PyPI"). Without that registration the upload is
  # refused, which used to fail every release. Runs after the GitHub Release is
  # published, so PyPI only ever receives files that are on a published release.
  publish-pypi:
    needs: [build, github-release]
    if: vars.PYPI_PUBLISH == 'true'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/magnidata/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      # Trusted Publishing: PyPI exchanges this job's OIDC token for a short-lived upload
      # token, so no PyPI password or API token is stored in the repository.
      - uses: pypa/gh-action-pypi-publish@release/v1
