name: CI
# Repository: https://github.com/Precision-AI-Inc/magnidata

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  unit-tests:
    uses: ./.github/workflows/unit-test.yml

  pre-commit:
    if: github.event_name == 'pull_request'
    uses: ./.github/workflows/pre-commit.yml
