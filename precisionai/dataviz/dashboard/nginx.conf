server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # BYOD dataset creation can upload hundreds of full-resolution field images.
    # Keep this above the Flask build cap so the API can return JSON validation
    # errors instead of nginx's generic 413 HTML page.
    client_max_body_size 18g;

    # Use Docker's embedded DNS so the upstream IP is re-resolved on each
    # connection — prevents stale IPs after the API container is rebuilt.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Proxy all /api calls to the Flask backend
    location /api {
        set $upstream http://api:5050;
        proxy_pass $upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Stream large uploads to the API instead of buffering the entire request
        # inside the nginx container first.
        proxy_request_buffering off;
        # Allow long dataset builds and large CSV downloads
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # Vite writes content-hashed filenames here, so they are safe to cache
    # forever. Crucially they must NOT fall through to the SPA fallback: a hash
    # that is gone means the browser is running a stale index.html, and serving
    # it index.html instead of a 404 hands back HTML with a text/html MIME type
    # that the browser refuses to execute as a module script — a silent blank
    # page. =404 makes that failure loud and lets the reload recover.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # index.html must be revalidated on every load. Each rebuild changes the
    # hashed asset names it references, so a cached copy points at files that no
    # longer exist.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # SPA fallback — all other paths serve index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
